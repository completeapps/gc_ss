<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Series SS | Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-toggle" id="sidebarToggle">
                <span class="toggle-icon">◀</span>
            </div>
            
            <div class="sidebar-header">
                <h1>Saint Series</h1>
                <p class="sidebar-subtitle">Admin Panel</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="caches">
                    <span class="nav-icon">📍</span>
                    <span class="nav-text">All Caches</span>
                </a>
                <a href="#" class="nav-item" data-section="logs">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">Recent Logs</span>
                </a>
                <a href="#" class="nav-item" data-section="map">
                    <span class="nav-icon">🗺️</span>
                    <span class="nav-text">Map</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <p>completeapps.github.io/gc_ss</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-left">
                    <h2>All Saint Series Caches</h2>
                    <p class="breadcrumb">~200 Caches | Bettendorf, Iowa</p>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" onclick="refreshCaches()">🔄 Refresh from Geocaching</button>
                </div>
            </header>

            <!-- Main Grid: All Caches -->
            <section class="content-section active" id="section-caches">
                <div class="cache-grid" id="cache-grid">
                    <!-- Cache cards will be loaded here from geocaching.com API -->
                </div>
            </section>

            <!-- Recent Logs Section -->
            <section class="content-section" id="section-logs">
                <h2 style="margin-bottom: 25px; font-family: 'Sabon', serif; font-size: 1.8rem;">Recent Activity Logs</h2>
                <div class="logs-container" id="logs-container">
                    <!-- Latest logs from each cache -->
                </div>
            </section>

            <!-- Map Section -->
            <section class="content-section" id="section-map">
                <div class="map-header">
                    <h2 style="margin-bottom: 20px; font-family: 'Sabon', serif; font-size: 1.8rem;">Saint Series Map</h2>
                    <button class="btn btn-outline-sm" onclick="centerMap()">Center on Bettendorf</button>
                </div>
                <div id="map"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
